<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NadoFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html{background:#0a0a0a}
  body{margin:0;min-height:100vh;color:#f2f2f2;font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  h1{font-size:40px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
  p.sub{color:#9a9a9a;margin:0 0 24px;text-align:center}
  .row{display:flex;gap:8px;width:100%;max-width:640px}
  input{flex:1;padding:14px;border-radius:8px;border:1px solid #3a3a3a;background:#111;color:#fff;font-size:15px;min-width:0;font-family:inherit}
  button,a.btn{padding:14px 20px;border-radius:8px;border:0;background:#f2f2f2;color:#0a0a0a;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
  button:disabled{opacity:.5}
  button:focus-visible,input:focus-visible,a.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #msg{margin:16px 0;color:#ff9b9b;min-height:20px}
  #c{width:100%;max-width:720px;border-radius:16px;display:none;box-shadow:0 20px 60px #000c}
  #actions{display:none;gap:8px;margin-top:16px}
  small{color:#6f6f6f;margin-top:24px;text-align:center;max-width:640px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<h1>NadoFlex</h1>
<p class="sub">Paste a wallet address and see your rank.</p>
<div class="row">
  <input id="addr" placeholder="0x... wallet address" autocomplete="off">
  <button id="go">Create card</button>
</div>
<div id="msg"></div>
<canvas id="c"></canvas>
<div id="actions">
  <button id="dl">Download PNG</button>
  <a class="btn" id="tw" target="_blank" rel="noopener">Share on X</a>
</div>
<small>Unofficial community tool. Data: Nado public archive API, default subaccount only. Realized PnL excludes funding; fees include sequencer fees. Active days are UTC days with at least one fill.</small>
<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => { const a = Math.abs(n), f = a >= 1000 ? 0 : 2; return (n < 0 ? '-' : '') + '$' + a.toLocaleString('en-US', { minimumFractionDigits: f, maximumFractionDigits: f }); };
const compact = (n) => (n < 0 ? '-' : '') + '$' + new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(Math.abs(n));
const TIERS = [[0, 'Initiate', '#8a8a8a'], [1e4, 'Squire', '#a3a3a3'], [1e5, 'Knight', '#bdbdbd'], [1e6, 'Templar', '#dcdcdc'], [1e7, 'Stormlord', '#ffffff']];
const HELM = ['................', '................', '.....oooooo.....', '...oo######oo...', '..o##h####h##o..', '..o##########o..', '..o##########o..', '..o#oooooooo#o..', '..o#oeeeeeeo#o..', '..o#oooooooo#o..', '..o##########o..', '..o##########o..', '...o########o...', '....oo####oo....', '......oooo......', '................'];
function sprite(n) {
  const g = HELM.map((r) => r.split(''));
  const put = (a, b, ch) => { g[b][a] = ch; g[b][15 - a] = ch; };
  if (n >= 1) for (let a = 3; a <= 7; a++) put(a, 5, 'a');
  if (n >= 2) { put(7, 1, 'a'); put(7, 2, 'a'); for (let b = 7; b <= 11; b++) put(7, b, 'h'); }
  if (n >= 3) { for (let b = 3; b <= 6; b++) put(7, b, 'a'); for (let a = 5; a <= 7; a++) put(a, 4, 'a'); }
  if (n >= 4) { put(7, 0, 'a'); put(6, 1, 'a'); put(1, 3, 'a'); put(1, 4, 'a'); put(0, 5, 'a'); }
  return g;
}
function emblem(x, cx, cy, r, col, n) {
  const hex = (rad) => { x.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k - Math.PI / 2; x[k ? 'lineTo' : 'moveTo'](cx + rad * Math.cos(a), cy + rad * Math.sin(a)); } x.closePath(); };
  hex(r); x.fillStyle = col + '22'; x.fill(); x.lineWidth = 4; x.strokeStyle = col; x.stroke();
  hex(r - 12); x.lineWidth = 1.5; x.strokeStyle = col + '88'; x.stroke();
  const pal = { o: '#222222', '#': '#5c5c5c', h: '#cfcfcf', e: col, a: col }, P = 5, ox = cx - 8 * P, oy = cy - 8 * P;
  sprite(n).forEach((row, yy) => row.forEach((ch, xx) => { if (ch !== '.') { x.fillStyle = pal[ch]; x.fillRect(ox + xx * P, oy + yy * P, P, P); } }));
}
const tierOf = (v) => { let i = 0; TIERS.forEach((t, j) => { if (v >= t[0]) i = j; }); return i; };

async function draw(d) {
  try { await document.fonts.load('800 120px "Bricolage Grotesque"'); await document.fonts.load('500 24px "Bricolage Grotesque"'); } catch (e) {}
  const F = '"Bricolage Grotesque",system-ui,sans-serif';
  const c = $('c'), x = c.getContext('2d');
  c.width = 1200; c.height = 630; c.style.display = 'block';
  const i = tierOf(d.volume), [min, name, col] = TIERS[i], next = TIERS[i + 1];
  const p = next ? Math.min(1, (d.volume - min) / (next[0] - min)) : 1;
  const rr = (a, b, w, h, r) => { x.beginPath(); x.roundRect(a, b, w, h, r); };

  // water
  let g = x.createLinearGradient(0, 0, 0, 630);
  g.addColorStop(0, '#1d1d1f'); g.addColorStop(1, '#060606');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  g = x.createRadialGradient(330, 200, 0, 330, 200, 520);
  g.addColorStop(0, col + '40'); g.addColorStop(1, col + '00');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  x.fillStyle = '#ffffff1a';
  for (let k = 0; k < 40; k++) x.fillRect(Math.round(((k * 397) % 900 + 40) / 6) * 6, Math.round(((k * 211) % 600 + 15) / 6) * 6, 6, 6);

  // wallet
  x.fillStyle = '#8a8a8a'; x.font = '500 26px ' + F;
  x.fillText('Wallet ' + d.address.slice(0, 6) + '…' + d.address.slice(-4), 70, 85);

  // hero: the creature
  emblem(x, 128, 185, 58, col, i);
  x.font = '800 116px ' + F; x.fillStyle = col; x.fillText(name, 215, 226);

  // volume
  x.font = '700 64px ' + F; x.fillStyle = '#fff';
  const vt = compact(d.volume); x.fillText(vt, 70, 325);
  const vw = x.measureText(vt).width;
  x.font = '500 30px ' + F; x.fillStyle = '#8a8a8a'; x.fillText('traded on Nado', 70 + vw + 18, 325);
  x.font = '500 24px ' + F;
  x.fillText(next ? Math.round(p * 100) + '% of the way to ' + next[1] : 'Deepest tier reached', 70, 368);

  // stats row
  const cells = [
    ['Realized PnL', (d.pnl > 0 ? '+' : '') + compact(d.pnl), '#f2f2f2'],
    ['Trades', d.trades.toLocaleString('en-US') + (d.truncated ? '+' : ''), '#fff'],
    [d.truncated ? 'Active days (recent)' : 'Active days', String(d.days || 0), '#fff'],
    [d.truncated ? 'Fees (recent)' : 'Fees paid', usd(d.fees), '#fff'],
  ];
  cells.forEach((k, j) => {
    const px = 70 + j * 232;
    if (j) { x.fillStyle = '#ffffff22'; x.fillRect(px - 30, 445, 2, 110); }
    x.fillStyle = '#8a8a8a'; x.font = '500 22px ' + F; x.fillText(k[0], px, 480);
    x.fillStyle = k[2]; x.font = '700 46px ' + F; x.fillText(k[1], px, 545);
  });

  // depth gauge
  const gx = 1000, y0 = 90, step = 110;
  x.lineCap = 'round'; x.lineWidth = 5; x.strokeStyle = '#ffffff25';
  x.beginPath(); x.moveTo(gx, y0); x.lineTo(gx, y0 + 4 * step); x.stroke();
  x.strokeStyle = col; x.beginPath(); x.moveTo(gx, y0); x.lineTo(gx, y0 + (i + p) * step - (next ? 0 : 0)); x.stroke();
  TIERS.forEach((t, j) => {
    const y = y0 + j * step, cur = j === i, passed = j <= i;
    if (cur) { x.beginPath(); x.arc(gx, y, 26, 0, 7); x.fillStyle = col + '33'; x.fill(); }
    x.beginPath(); x.arc(gx, y, cur ? 15 : 9, 0, 7);
    x.fillStyle = passed ? t[2] : '#151515'; x.fill();
    x.lineWidth = 3; x.strokeStyle = passed ? t[2] : '#ffffff40'; x.stroke();
    x.textAlign = 'left';
    x.fillStyle = cur ? '#fff' : passed ? '#c8c8c8' : '#666666';
    x.font = (cur ? '800 32px ' : '500 26px ') + F; x.fillText(t[1], gx + 38, y + 8);
    if (j) { x.fillStyle = '#666666'; x.font = '500 18px ' + F; x.fillText(compact(t[0]) + '+', gx + 38, y + 30); }
  });

  // footer
  const since = d.first ? new Date(d.first * 1000).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '';
  x.fillStyle = '#666666'; x.font = '500 20px ' + F;
  x.fillText(d.truncated ? 'Based on the latest 4,000 fills' : (since ? 'Trading since ' + since : ''), 70, 602);
  x.textAlign = 'right'; x.fillText('NadoFlex, unofficial', 1130, 602); x.textAlign = 'left';
}

async function run() {
  const a = $('addr').value.trim();
  $('msg').textContent = ''; $('go').disabled = true; $('go').textContent = 'Loading…';
  $('c').style.display = 'none'; $('actions').style.display = 'none';
  try {
    const r = await fetch('/api/stats?address=' + encodeURIComponent(a));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    if (!d.trades) throw new Error('No Nado trades found for this address');
    await draw(d);
    $('actions').style.display = 'flex';
    const t = TIERS[tierOf(d.volume)];
    const text = `My Nado trader card: ${t[1]} tier, ${compact(d.volume)} volume, ${d.pnl >= 0 ? '+' : ''}${compact(d.pnl)} realized PnL, ${d.trades} trades. Check yours:`;
    $('tw').href = 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href);
  } catch (e) {
    $('msg').textContent = e.message;
  }
  $('go').disabled = false; $('go').textContent = 'Create card';
}

function bg() {
  const c = $('bg'), x = c.getContext('2d'), S = 6;
  c.width = innerWidth; c.height = innerHeight;
  const B = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const cols = Math.ceil(c.width / S), rows = Math.ceil(c.height / S);
  const cx = cols * 0.84, cy = rows * 0.24, R = Math.min(cols, rows) * 0.36;
  x.fillStyle = 'rgba(255,255,255,0.15)';
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const dx = i - cx, dy = j - cy, d = Math.hypot(dx, dy);
    let v = Math.pow(j / rows, 2.6) * 0.5;
    if (d < R) { const nz = Math.sqrt(1 - (d / R) ** 2); v = Math.max(v, Math.min(1, Math.max(0, (-dx * 0.5 - dy * 0.6) / R * 0.7 + nz * 0.6 + 0.2))); }
    if (v > (B[j % 4][i % 4] + 0.5) / 16) x.fillRect(i * S, j * S, S - 1, S - 1);
  }
}
bg(); addEventListener('resize', bg);
$('go').onclick = run;
$('addr').onkeydown = (e) => { if (e.key === 'Enter') run(); };
$('dl').onclick = () => {
  const l = document.createElement('a');
  l.download = 'nadoflex-card.png'; l.href = $('c').toDataURL('image/png'); l.click();
};
</script>
</body>
</html>
